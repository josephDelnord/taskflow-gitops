# L'application suit le dépôt josephDelnord/taskflow-gitops sur main.
# Vérifiez le contexte kubectl avant d'appliquer ce manifeste.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/josephDelnord/taskflow-gitops.git
    targetRevision: main
    path: apps/taskflow
  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
